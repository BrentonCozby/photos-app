name: server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # server/ imports constants/ and models/ from the repo root, and those compile
      # with importHelpers, so the root's tslib has to be installed too.
      - name: Install the root dependencies
        run: npm ci
        working-directory: .

      - run: npm ci

      - name: Check the architecture boundaries
        run: npm run check:arch

      - name: Run the tests
        run: npm test
